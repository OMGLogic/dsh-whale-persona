# dsh-whale-persona bundle patch：向 web profile 注入人设插件行。
# 条目 id 就是 settings 命名空间：host 半的 Config.enabled 是 volatile 字段，
# client 半据此 id 调用 ctx.configForms.get('dsh-whale-persona') 读写开关。
# Node half（lib/index.mjs）注册全局鲸鱼娘人设段；
# client half（lib/client.js）由 __ModuleLoader__ 挂载对话输入栏开关。
- insert:
    - id: dsh-whale-persona
      name: 'dsh-whale-persona'
