# dsh-whale-persona bundle patch：向 profile 注入人设插件行。
# Node half（lib/index.mjs）按开关注册/卸载全局鲸鱼娘人设段；
# client half（lib/client.js）由 __ModuleLoader__ 挂载对话输入栏开关。
# 行 id `whale-persona` 同时是 settings 命名空间（settings 以 profile entry id 为 ns）。
# 注意：必须包在 `insert:` 里；裸的 id/name 行是「按 id 覆盖」，在该行尚不存在时会被静默跳过。
- insert:
    - id: whale-persona
      name: 'dsh-whale-persona'
